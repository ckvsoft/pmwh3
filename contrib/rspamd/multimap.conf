# /etc/rspamd/local.d/multimap.conf (+APPEND)
#
# pmwh3 W/B lists: rspamd pulls the list contents over HTTP from the
# pmwh3 filtering endpoints (they need no login -- the ?key= token
# IS the auth). type=from matches the sender (address, @domain,
# IP/CIDR); prefilter decides hard (accept/reject) outside the
# scoring -- amavis-style W/B semantics.
#
# Variables: @BASE_URL@ @RSPAMD_MAP_TOKEN@
#   @RSPAMD_MAP_TOKEN@ must equal the pmwh3 setting RSPAMD_MAP_TOKEN
#   (Options -> Email); generate e.g. with `openssl rand -hex 32`.

PMWH3_WHITELIST {
    type = "from";
    prefilter = true;
    action = "accept";
    map = "@BASE_URL@/pmwh3/filtering/map_wblist/W?key=@RSPAMD_MAP_TOKEN@";
}

PMWH3_BLACKLIST {
    type = "from";
    prefilter = true;
    action = "reject";
    map = "@BASE_URL@/pmwh3/filtering/map_wblist/B?key=@RSPAMD_MAP_TOKEN@";
}

# /etc/rspamd/local.d/settings.conf (+APPEND)
#
# pmwh3 per-scope spam thresholds: for every message rspamd asks
# pmwh3 (recipient selector) and receives
# {"actions":{"add header":t,"reject":k}} -- pmwh3 resolves the
# @mailbox -> @domain inheritance server-side. greylist / subject
# rewriting / learning stay global rspamd config.
#
# Variables: @BASE_URL@ @RSPAMD_MAP_TOKEN@
#   @RSPAMD_MAP_TOKEN@ must equal the pmwh3 setting RSPAMD_MAP_TOKEN.
#   method = "body" (NOT "query" -- query would replace ?key=).

pmwh3_thresholds {
    priority = medium;
    external_map {
        map {
            external = true;
            backend = "@BASE_URL@/pmwh3/filtering/settings_query?key=@RSPAMD_MAP_TOKEN@";
            method = "body";
            encode = "json";
            timeout = 3.0;
        }
        selector = "id('rcpt');rcpts:addr.lower";
    }
}
